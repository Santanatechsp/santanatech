<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Villas Performance Club</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-soft:#f8f9fa;
  --surface-muted:#eef0f2;
  --sidebar:#111214;
  --sidebar-2:#181a1d;
  --text:#16181b;
  --text-soft:#535860;
  --muted:#7b818a;
  --line:#e1e4e8;
  --line-dark:#2b2f34;
  --yellow:#e0b800;
  --yellow-soft:#fff7cc;
  --yellow-ink:#7a6300;
  --success:#16803f;
  --success-soft:#e9f7ee;
  --danger:#c93636;
  --danger-soft:#fdeeee;
  --warning:#ad6f00;
  --warning-soft:#fff5df;
  --shadow:0 10px 30px rgba(18,21,25,.06);
  --radius-xl:20px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:10px;
  --sidebar-w:252px;
  --topbar-h:72px;
  --mobile-nav-h:74px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Poppins',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-weight:400;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

.app-root{min-height:100vh}

/* ========== LOGIN ========== */
.login-screen{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(420px,44%) 1fr;
  background:#0d0e10;
}
.login-visual{
  padding:56px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border-right:1px solid #25282c;
  background:
    radial-gradient(circle at 14% 20%, rgba(224,184,0,.10), transparent 28%),
    linear-gradient(180deg,#111214,#0b0c0d);
}
.login-brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  border:1px solid #34383d;
  background:#17191c;
  color:#f6f6f6;
}
.brand-mark svg{width:20px;height:20px}
.brand-copy b{
  display:block;
  font-size:16px;
  font-weight:600;
  color:#fff;
}
.brand-copy span{
  display:block;
  color:#90959b;
  font-size:11px;
  margin-top:2px;
}
.login-hero{
  max-width:520px;
}
.login-hero .eyebrow{
  color:#d6b800;
  font-size:12px;
  font-weight:600;
  margin-bottom:14px;
}
.login-hero h1{
  color:#fff;
  font-size:42px;
  line-height:1.16;
  margin:0 0 18px;
  font-weight:600;
}
.login-hero p{
  margin:0;
  color:#9da2a9;
  line-height:1.7;
  max-width:470px;
  font-size:14px;
}
.login-foot{
  color:#656a71;
  font-size:11px;
}
.login-form-area{
  background:#f4f5f7;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:36px;
}
.login-card{
  width:100%;
  max-width:410px;
}
.login-card h2{
  margin:0;
  font-size:26px;
  font-weight:600;
}
.login-card .lead{
  color:var(--muted);
  font-size:13px;
  margin:8px 0 28px;
}
.role-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  background:#e7e9ec;
  border-radius:12px;
  margin-bottom:20px;
}
.role-switch button{
  border:0;
  border-radius:9px;
  padding:10px 12px;
  background:transparent;
  color:#646a72;
  font-weight:500;
}
.role-switch button.active{
  background:#fff;
  color:#17191c;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.field{margin-bottom:16px}
.field label{
  display:block;
  margin-bottom:7px;
  color:#4f555d;
  font-size:12px;
  font-weight:500;
}
.field input,.field select{
  width:100%;
  border:1px solid #d8dce1;
  background:#fff;
  color:#16181b;
  border-radius:11px;
  padding:13px 14px;
  outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus,.field select:focus{
  border-color:#8f949a;
  box-shadow:0 0 0 3px rgba(20,22,25,.06);
}
.login-error{
  min-height:20px;
  color:var(--danger);
  font-size:12px;
  margin-top:10px;
}
.demo-note{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:#8b9198;
  line-height:1.6;
}

/* ========== BUTTONS ========== */
.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:500;
  transition:transform .16s,background .16s,border-color .16s,opacity .16s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{
  background:#17191c;
  color:#fff;
}
.btn-primary:hover:not(:disabled){background:#26292d}
.btn-primary:disabled{
  background:#d5d8dc;
  color:#8d9298;
  opacity:.75;
}
.btn-yellow{
  background:var(--yellow);
  color:#181818;
}
.btn-yellow:hover:not(:disabled){background:#cba700}
.btn-ghost{
  background:#fff;
  color:#353a40;
  border:1px solid var(--line);
}
.btn-ghost:hover:not(:disabled){background:#f7f8f9}
.btn-danger{
  background:#fff;
  color:var(--danger);
  border:1px solid #f0c9c9;
}
.btn-icon{
  width:36px;height:36px;padding:0;border-radius:10px;
}
.btn svg,.icon svg{width:17px;height:17px;display:block}

/* ========== APP SHELL ========== */
.portal{min-height:100vh}
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar-w);
  background:var(--sidebar);
  border-right:1px solid #26292d;
  z-index:60;
  display:flex;
  flex-direction:column;
  padding:22px 14px;
}
.sidebar .login-brand{padding:0 8px 20px;border-bottom:1px solid #282b2f;margin-bottom:16px}
.sidebar-nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.nav-label{
  color:#62676d;
  font-size:10px;
  font-weight:500;
  padding:9px 12px 4px;
}
.side-nav-item{
  border:0;
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  background:transparent;
  color:#a8adb4;
  border-radius:10px;
  padding:11px 12px;
  font-size:13px;
  text-align:left;
  position:relative;
  transition:background .18s,color .18s,transform .18s;
}
.side-nav-item:hover{
  background:#1d2024;
  color:#f2f2f2;
}
.side-nav-item.active{
  background:#22252a;
  color:#fff;
}
.side-nav-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:var(--yellow);
}
.side-nav-item .nav-icon{
  width:19px;height:19px;
  display:grid;place-items:center;
  color:#7b8087;
}
.side-nav-item.active .nav-icon{color:var(--yellow)}
.side-nav-item svg{width:18px;height:18px}
.sidebar-bottom{
  margin-top:auto;
  padding:14px 8px 0;
  border-top:1px solid #282b2f;
}
.profile-mini{
  display:flex;
  gap:10px;
  align-items:center;
  padding:2px 0 12px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:#2a2d31;
  color:#fff;
  font-weight:600;
  font-size:12px;
  flex:none;
}
.profile-mini b{
  display:block;color:#fff;font-size:12px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;
}
.profile-mini span{color:#777d84;font-size:10px}
.logout-link{
  border:0;background:transparent;color:#888e95;width:100%;
  display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12px;
}
.logout-link:hover{color:#fff}

.topbar{
  position:fixed;
  left:var(--sidebar-w);
  right:0;
  top:0;
  height:var(--topbar-h);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}
.topbar-title b{
  display:block;font-size:15px;font-weight:600;
}
.topbar-title span{
  display:block;color:var(--muted);font-size:11px;margin-top:2px;
}
.topbar-actions{display:flex;align-items:center;gap:9px}
.topbar-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;
  color:#4f555c;font-size:11px;
}
.topbar-chip strong{color:#15171a;font-weight:600}

.content{
  margin-left:var(--sidebar-w);
  padding:calc(var(--topbar-h) + 28px) 30px 42px;
  min-height:100vh;
}
.page{
  animation:pageIn .24s ease both;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}

.mobile-topbar,.mobile-nav{display:none}

/* ========== GENERIC CONTENT ========== */
.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}
.page-head h1{
  margin:0;
  font-size:26px;
  font-weight:600;
}
.page-head p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

.grid-kpi{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpi{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:17px;
  min-width:0;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.kpi:hover{
  transform:translateY(-2px);
  border-color:#d5d9de;
  box-shadow:var(--shadow);
}
.kpi-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.kpi-icon{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;
  background:#f0f2f4;
  color:#3b4046;
}
.kpi-icon.yellow{
  color:var(--yellow-ink);
  background:var(--yellow-soft);
}
.kpi-icon svg{width:18px;height:18px}
.kpi-value{
  margin-top:16px;
  color:#17191c;
  font-size:27px;
  font-weight:600;
}
.kpi-label{
  margin-top:2px;
  color:#525860;
  font-size:11px;
}
.kpi-foot{
  margin-top:10px;
  color:#92979e;
  font-size:10px;
}
.kpi-delta{
  padding:4px 7px;
  border-radius:999px;
  background:#f1f3f4;
  color:#555b62;
  font-size:9px;
  font-weight:500;
}
.kpi-delta.good{background:var(--success-soft);color:var(--success)}

.grid-main{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
  gap:16px;
  align-items:start;
}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:hidden;
}
.panel + .panel{margin-top:16px}
.panel-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line);
}
.panel-title{
  margin:0;
  font-size:14px;
  font-weight:600;
}
.panel-sub{
  margin:4px 0 0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.5;
}
.panel-body{padding:18px}
.panel-empty{
  padding:34px 18px;
  text-align:center;
  color:#8d9299;
}
.panel-empty .empty-icon{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:#f0f2f4;color:#7c8289;
  margin:0 auto 10px;
}
.panel-empty strong{
  display:block;color:#4e545b;font-size:12px;font-weight:500;
}
.panel-empty span{
  display:block;font-size:10px;margin-top:4px;
}
.section-label{
  font-size:10px;
  color:#8a9097;
  margin-bottom:7px;
}
.section-value{
  font-size:22px;
  font-weight:600;
}
.hairline{height:1px;background:var(--line);margin:16px 0}

/* progress */
.progress-row{margin-bottom:14px}
.progress-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10.5px;margin-bottom:6px;
}
.progress-meta b{font-weight:500;color:#31363c}
.progress-meta span{color:#7e848b}
.progress-track{
  height:9px;border-radius:999px;background:#eceff1;overflow:hidden;
  border:1px solid #e2e5e8;
}
.progress-fill{
  height:100%;
  border-radius:999px;
  background:#23262a;
  position:relative;
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.progress-fill.yellow-edge{
  box-shadow:inset 0 -2px 0 var(--yellow);
}

/* dark feature card */
.performance-card{
  background:#15171a;
  border:1px solid #25282c;
  border-radius:var(--radius-xl);
  padding:22px;
  color:#f7f7f7;
}
.performance-card .muted{color:#8f959d}
.performance-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
}
.performance-top .tag{
  padding:6px 9px;border-radius:999px;
  background:#272a2e;color:#e3e4e6;font-size:9px;
}
.performance-main{
  display:grid;grid-template-columns:126px 1fr;gap:22px;align-items:center;margin-top:22px;
}
.ring{
  --pct:0;
  width:118px;height:118px;border-radius:50%;
  background:conic-gradient(var(--yellow) calc(var(--pct)*1%), #30343a 0);
  position:relative;
  display:grid;place-items:center;
}
.ring::after{
  content:"";position:absolute;inset:10px;border-radius:50%;background:#15171a;
}
.ring-center{
  position:relative;z-index:1;text-align:center;
}
.ring-center b{display:block;font-size:23px;font-weight:600;color:#fff}
.ring-center span{display:block;font-size:9px;color:#9ba0a7;margin-top:2px}
.performance-metrics{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;
}
.pmetric{
  border:1px solid #2a2e33;
  background:#1b1e22;
  border-radius:12px;
  padding:12px;
}
.pmetric b{display:block;color:#fff;font-size:16px;font-weight:600}
.pmetric span{display:block;color:#8d939b;font-size:9px;margin-top:3px}

/* tables */
.table-wrap{overflow-x:auto}
.table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}
.table th{
  text-align:left;
  padding:11px 14px;
  background:#fafbfb;
  border-bottom:1px solid var(--line);
  color:#777d84;
  font-size:9.5px;
  font-weight:500;
}
.table td{
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  color:#383d43;
  font-size:11px;
  vertical-align:middle;
}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .15s}
.table tbody tr:hover{background:#fafbfb}
.table .current-row{background:#fffbea}
.table .current-row:hover{background:#fff8d8}
.person{
  display:flex;align-items:center;gap:9px;min-width:150px;
}
.person .avatar{
  width:32px;height:32px;background:#eceff1;color:#43484e;font-size:10px;
}
.person b{font-size:11px;font-weight:500;color:#292e33}
.person small{display:block;color:#999ea5;font-size:9px;margin-top:1px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:999px;
  background:#f0f2f4;color:#575d64;font-size:9px;font-weight:500;
}
.badge.active{background:var(--success-soft);color:var(--success)}
.badge.inactive{background:var(--danger-soft);color:var(--danger)}
.badge.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.actions{display:flex;gap:6px}

/* ranking */
.podium-section{
  padding:18px;
}
.podium{
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  align-items:end;
  gap:12px;
  max-width:720px;
  margin:18px auto 8px;
}
.podium-card{
  text-align:center;
  border:1px solid var(--line);
  border-radius:16px 16px 10px 10px;
  background:#fafbfb;
  padding:16px 12px 14px;
  position:relative;
}
.podium-card.first{
  min-height:190px;
  background:#17191c;
  border-color:#17191c;
  color:#fff;
  padding-top:21px;
}
.podium-card.second{min-height:160px}
.podium-card.third{min-height:145px}
.podium-place{
  position:absolute;
  top:10px;left:10px;
  font-size:10px;
  color:#737980;
}
.podium-card.first .podium-place{color:#c6c9cd}
.podium-avatar{
  width:54px;height:54px;border-radius:50%;
  margin:0 auto 10px;
  display:grid;place-items:center;
  font-size:14px;font-weight:600;
  background:#e8ebed;color:#444a50;
  border:3px solid #fff;
  box-shadow:0 0 0 1px #d9dde1;
}
.podium-card.first .podium-avatar{
  width:66px;height:66px;
  background:#2a2d31;color:#fff;
  border-color:#34383d;
  box-shadow:0 0 0 2px var(--yellow);
}
.crown{
  color:var(--yellow);
  font-size:18px;
  margin-bottom:2px;
}
.podium-name{
  font-size:12px;font-weight:600;
}
.podium-card.first .podium-name{color:#fff}
.podium-pct{
  margin-top:8px;
  font-size:22px;
  font-weight:600;
  color:#202327;
}
.podium-card.first .podium-pct{color:var(--yellow)}
.podium-caption{
  font-size:9px;color:#8b9198;margin-top:2px;
}
.podium-card.first .podium-caption{color:#92989f}
.you-pill{
  display:inline-flex;
  margin-top:8px;
  padding:4px 7px;
  border-radius:999px;
  background:var(--yellow-soft);
  color:var(--yellow-ink);
  font-size:8px;
  font-weight:500;
}
.rank-row{
  display:grid;
  grid-template-columns:44px minmax(160px,1fr) minmax(180px,1.2fr) 80px;
  gap:14px;
  align-items:center;
  padding:12px 16px;
  border-top:1px solid var(--line);
}
.rank-row.you{background:#fffbea}
.rank-pos{
  font-weight:600;font-size:13px;color:#555b62;
}
.rank-progress .progress-meta{margin:0 0 5px}
.rank-score{
  text-align:right;
}
.rank-score b{display:block;font-size:12px;font-weight:600}
.rank-score span{display:block;font-size:8.5px;color:#8d9299}

/* launch */
.segmented{
  display:inline-flex;
  background:#eceff1;
  padding:4px;
  border-radius:11px;
  margin-bottom:16px;
}
.segmented button{
  border:0;background:transparent;color:#6d737a;
  padding:8px 12px;border-radius:8px;font-size:10px;font-weight:500;
}
.segmented button.active{
  background:#fff;color:#23272b;box-shadow:0 1px 5px rgba(0,0,0,.06);
}
.service-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.service-card{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:14px;
  text-align:left;
  min-height:100px;
  transition:border .15s,background .15s,transform .15s;
}
.service-card:hover{transform:translateY(-1px);border-color:#cdd2d7}
.service-card.selected{
  border-color:#23262a;
  background:#fafbfb;
  box-shadow:inset 0 -2px 0 var(--yellow);
}
.service-card b{display:block;font-size:11px;font-weight:500;color:#272c31}
.service-card span{display:block;color:#7c8289;font-size:9px;margin-top:6px}

.launch-summary{
  display:flex;align-items:center;justify-content:space-between;gap:16px;

.launch-summary small{display:block;color:#8d939a;font-size:9px}

.stepper{

}
.stepper button{
  width:40px;height:40px;border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  color:#333;
}
.stepper strong{font-size:28px;font-weight:600;min-width:50px;text-align:center}

/* roulette */
.roulette-layout{
  display:grid;
  grid-template-columns:minmax(340px,.85fr) minmax(300px,1.15fr);
  gap:18px;
}
.roulette-stage{
  background:#17191c;
  color:#fff;
  border-radius:18px;
  padding:24px;
  text-align:center;
  border:1px solid #24282c;
}
.roulette-stage .stage-title{font-size:14px;font-weight:600}
.roulette-stage .stage-sub{font-size:10px;color:#91979f;margin-top:4px}
.wheel-wrap{
  position:relative;
  width:min(330px,78vw);
  height:min(330px,78vw);
  margin:28px auto 20px;
}
.wheel-pointer{
  position:absolute;
  top:-2px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:26px solid #0b0b0c;
  z-index:8;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
}
.wheel{
  width:100%;height:100%;border-radius:50%;
  border:9px solid #070708;
  position:relative;
  background:conic-gradient(
    #ef4444 0deg 60deg,
    #f97316 60deg 120deg,
    #eab308 120deg 180deg,
    #22c55e 180deg 240deg,
    #3b82f6 240deg 300deg,
    #a855f7 300deg 360deg
  );
  box-shadow:0 12px 30px rgba(0,0,0,.3), inset 0 0 0 2px rgba(255,255,255,.2);
  transition:transform 4.7s cubic-bezier(.14,.88,.16,1);
}
.wheel::after{
  content:"";position:absolute;inset:50%;width:58px;height:58px;
  margin:-29px;border-radius:50%;background:#0c0d0e;border:6px solid #22262a;
}
.wheel-label{
  position:absolute;
  left:50%;top:50%;
  width:90px;
  margin-left:-45px;
  margin-top:-8px;
  color:#111;
  font-size:9px;
  font-weight:600;
  text-align:center;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  transform-origin:45px 8px;
  pointer-events:none;
  z-index:2;
}
.roulette-stage .btn{min-width:180px}
.spin-info{
  margin-top:10px;
  color:#a0a5ac;
  font-size:10px;
}
.spin-info strong{color:var(--yellow);font-weight:600}

.mini-bars{
  display:flex;

  height:150px;

}
.mini-bar-col{
  flex:1;

}
.mini-bar{

  position:relative;
}
.mini-bar::after{

}
.mini-bar-col span{font-size:8.5px;color:#8e949b;margin-top:7px}

/* modal / toast */
.modal-backdrop{
  position:fixed;inset:0;z-index:200;

  padding:20px;background:rgba(10,11,12,.58);

}
.modal-backdrop.show{opacity:1;pointer-events:auto}
.modal{

.modal-backdrop.show .modal{transform:none}
.modal-head{

.toast{

  border-radius:12px;padding:11px 14px;

}
.toast.show{opacity:1;transform:none}

/* misc */

function e(v=''){
  return String(v).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
}
function initials(name){
  return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
}
function pctRaw(b){
  if(!b || !b.goals || !Number(b.goals.meta)) return 0;
  return Math.round((Number(b.points)||0)/Number(b.goals.meta)*100);
}
function pctBar(b){ return Math.min(100,Math.max(0,pctRaw(b))); }
function tier(b){
  const p=pctRaw(b);
  if(p>=130) return 'Supermeta';
  if(p>=100) return 'Meta atingida';
  if(p>=70) return 'Faixa avançada';
  if(p>=40) return 'Em evolução';
  return 'Início do ciclo';
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function currentBarber(){
  return DB.barbers.find(b=>b.id===SESSION.barberId);
}
function activeBarbers(){
  return DB.barbers.filter(b=>b.status==='active');
}
function rankData(){
  return [...activeBarbers()].sort((a,b)=>pctRaw(b)-pctRaw(a) || b.points-a.points);
}
function showToast(msg){

}

function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginError');
  if(LOGIN_ROLE==='admin'){
    if(u.toLowerCase()===ADMIN_USER.username && p===ADMIN_USER.password){
      SESSION={role:'admin',barberId:null,view:'overview'};
      render();
      return;
    }
  }else{
    const b=DB.barbers.find(x=>x.username.toLowerCase()===u.toLowerCase() && x.password===p && x.status==='active');
    if(b){
      SESSION={role:'barber',barberId:b.id,view:'home'};
      render();
      return;
    }
  }
  err.textContent='Usuário ou senha inválidos.';
}

function wheelBackground(){
  let deg=0;
  const total=DB.prizes.length||1;
  const slice=360/total;
  return `conic-gradient(${DB.prizes.map((p,i)=>{
    const start=i*slice,end=(i+1)*slice;
    return `${p.color} ${start}deg ${end}deg`;
  }).join(',')})`;
}
function wheelLabels(){
  const total=DB.prizes.length||1;
  const radius=112;
  return DB.prizes.map((p,i)=>{
    const angle=(i+.5)*(360/total)-90;
    const rad=angle*Math.PI/180;
    const x=Math.cos(rad)*radius;
    const y=Math.sin(rad)*radius;
    return `<div class="wheel-label" style="transform:translate(${x}px,${y}px) rotate(${angle+90}deg);">${e(p.label)}</div>`;
  }).join('');
}

function confirmServices(){
  const b=currentBarber();
  if(!selectedServices.length) return;
  const now=new Date().toISOString();
  let total=0;
  selectedServices.forEach(id=>{
    const s=DB.services.find(x=>x.id===id);
    if(!s) return;
    b.points+=Number(s.points)||0;
    total+=Number(s.points)||0;
    DB.history.services.unshift({date:now,barberId:b.id,barberName:b.name,serviceName:s.name,points:Number(s.points)||0});
  });
  selectedServices=[];
  saveDB();
  showToast(`Lançamento concluído: +${total} pontos`);
  SESSION.view='home';
  render();
}

function bindProductStepper(){
  const minus=document.getElementById('qtyMinus');
  const plus=document.getElementById('qtyPlus');
  const val=document.getElementById('qtyValue');
  const confirm=document.getElementById('confirmProduct');
  if(!minus||!plus||!val||!confirm) return;
  let qty=1;
  minus.addEventListener('click',()=>{qty=Math.max(1,qty-1);val.textContent=qty});
  plus.addEventListener('click',()=>{qty=Math.min(50,qty+1);val.textContent=qty});
  confirm.addEventListener('click',()=>{
    const b=currentBarber();
    b.productsSold+=qty;
    let earned=0;
    while(b.productsSold>=DB.productGoal.threshold){
      b.productsSold-=DB.productGoal.threshold;
      b.spinsAvailable++;
      earned++;
    }
    DB.history.products.unshift({date:new Date().toISOString(),barberId:b.id,barberName:b.name,qty});
    saveDB();
    showToast(earned?`Venda registrada • ${earned} giro(s) liberado(s)`:`${qty} produto(s) registrado(s)`);
    renderPage();
  });
}

function weightedPrize(){
  const total=DB.prizes.reduce((s,p)=>s+Math.max(0,Number(p.probability)||0),0);
  if(total<=0) return DB.prizes[0]||null;
  let r=Math.random()*total;
  for(const p of DB.prizes){
    r-=Math.max(0,Number(p.probability)||0);
    if(r<=0) return p;
  }
  return DB.prizes[DB.prizes.length-1]||null;
}

function spinWheel(){
  const b=currentBarber();
  if(spinning||b.spinsAvailable<1||!DB.prizes.length) return;
  const prize=weightedPrize();
  if(!prize) return;
  spinning=true;
  b.spinsAvailable--;
  saveDB();

  const idx=DB.prizes.findIndex(p=>p.id===prize.id);
  const slice=360/DB.prizes.length;
  const targetMid=idx*slice+slice/2;
  wheelRotation=(Math.floor(wheelRotation/360)+6)*360+(360-targetMid);
  const wheel=document.getElementById('wheel');
  if(wheel) wheel.style.transform=`rotate(${wheelRotation}deg)`;
  const btn=document.getElementById('spinBtn');
  if(btn){btn.disabled=true;btn.textContent='Girando...'}

  setTimeout(()=>{
    if(prize.type==='spin') b.spinsAvailable+=Number(prize.value)||1;
    DB.history.roulette.unshift({date:new Date().toISOString(),barberId:b.id,barberName:b.name,prize:prize.label});
    saveDB();
    spinning=false;
    openModal(`
      <div class="modal-head"><h3>Resultado da roleta</h3><button class="btn btn-ghost btn-icon" id="mClose">×</button></div>
      <div class="modal-body" style="text-align:center;padding:28px 18px;">
        <div style="font-size:34px;">🎉</div>
        <div style="font-size:12px;color:#7b8188;margin-top:9px;">Você ganhou</div>
        <div style="font-size:26px;font-weight:600;margin-top:5px;">${e(prize.label)}</div>
        ${prize.type==='spin'?`<div class="notice yellow" style="margin-top:16px;">O prêmio adicionou ${prize.value||1} novo giro ao seu saldo.</div>`:''}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="mContinue">Continuar</button>
        ${b.spinsAvailable>0?`<button class="btn btn-primary" id="mSpinAgain">Girar novamente (${b.spinsAvailable})</button>`:''}
      </div>`);
    document.getElementById('mClose').onclick=()=>{closeModal();renderPage()};
    document.getElementById('mContinue').onclick=()=>{closeModal();renderPage()};
    const again=document.getElementById('mSpinAgain');
    if(again) again.onclick=()=>{closeModal();renderPage();setTimeout(spinWheel,160)};
  },4700);
}

    <div class="modal-head"><h3>${s?'Editar serviço':'Novo serviço'}</h3><button class="btn btn-ghost btn-icon" id="mClose">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome do serviço</label><input id="sName" value="${s?e(s.name):''}"></div>
      <div class="field"><label>Pontuação</label><input id="sPoints" type="number" min="0" value="${s?s.points:5}"></div>
      <div class="field"><label>Status</label><select id="sActive"><option value="1" ${!s||s.active!==false?'selected':''}>Ativo</option><option value="0" ${s&&s.active===false?'selected':''}>Inativo</option></select></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button></div>`);
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mCancel').onclick=closeModal;
  document.getElementById('mSave').onclick=()=>{
    const name=document.getElementById('sName').value.trim();
    if(!name){showToast('Informe o nome do serviço');return}
    const obj={id:s?s.id:'s'+Date.now(),name,points:Number(document.getElementById('sPoints').value)||0,active:document.getElementById('sActive').value==='1'};
    if(s) Object.assign(s,obj); else DB.services.push(obj);
    saveDB();closeModal();renderPage();showToast('Serviço salvo');
  };
}
function deleteService(id){
  if(!confirm('Excluir este serviço?')) return;
  DB.services=DB.services.filter(x=>x.id!==id);
  saveDB();renderPage();showToast('Serviço removido');
}
function saveThreshold(){
  const v=Math.max(1,Number(document.getElementById('threshold').value)||1);
  DB.productGoal.threshold=v;
  saveDB();renderPage();showToast('Regra da campanha atualizada');
}
function prizeModal(id=null){
  const p=id?DB.prizes.find(x=>x.id===id):null;
  const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7'];
  openModal(`
    <div class="modal-head"><h3>${p?'Editar prêmio':'Novo prêmio'}</h3><button class="btn btn-ghost btn-icon" id="mClose">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome do prêmio</label><input id="pLabel" value="${p?e(p.label):''}"></div>
      <div class="field"><label>Probabilidade (%)</label><input id="pProbability" type="number" min="0" max="100" value="${p?p.probability:10}"></div>
      <div class="field"><label>Tipo</label><select id="pType">
        <option value="money" ${p&&p.type==='money'?'selected':''}>Dinheiro</option>
        <option value="product" ${p&&p.type==='product'?'selected':''}>Produto</option>
        <option value="voucher" ${p&&p.type==='voucher'?'selected':''}>Voucher</option>
        <option value="spin" ${p&&p.type==='spin'?'selected':''}>Giro adicional</option>
      </select></div>
      <div class="field"><label>Valor / quantidade</label><input id="pValue" type="number" min="0" value="${p?p.value:1}"></div>
      <div class="field"><label>Cor do gomo</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${colors.map(c=>`<button type="button" class="colorPick" data-color="${c}" style="width:34px;height:34px;border-radius:10px;border:2px solid ${p&&p.color===c?'#111':'transparent'};background:${c};"></button>`).join('')}</div><input type="hidden" id="pColor" value="${p?p.color:colors[0]}"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button></div>`);
  document.querySelectorAll('.colorPick').forEach(btn=>btn.onclick=()=>{
    document.getElementById('pColor').value=btn.dataset.color;
    document.querySelectorAll('.colorPick').forEach(x=>x.style.border='2px solid transparent');
    btn.style.border='2px solid #111';
  });
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mCancel').onclick=closeModal;
  document.getElementById('mSave').onclick=()=>{
    const label=document.getElementById('pLabel').value.trim();
    const probability=Number(document.getElementById('pProbability').value);
    if(!label){showToast('Informe o nome do prêmio');return}
    if(probability<0||probability>100){showToast('Probabilidade deve ficar entre 0 e 100');return}
    const obj={
      id:p?p.id:'p'+Date.now(),
      label,
      probability,
      type:document.getElementById('pType').value,
      value:Number(document.getElementById('pValue').value)||1,
      color:document.getElementById('pColor').value
    };
    if(p) Object.assign(p,obj); else DB.prizes.push(obj);
    saveDB();closeModal();renderPage();showToast('Prêmio salvo');
  };
}
function deletePrize(id){
  if(!confirm('Excluir este prêmio?')) return;
  DB.prizes=DB.prizes.filter(x=>x.id!==id);
  saveDB();renderPage();showToast('Prêmio removido');
}

render();
</script>
</body>
</html>
