<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Villas Performance Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* dark ink surfaces (profile card, top bar, admin sidebar) */
  --void:#121214;
  --surface:#1c1824;
  --surface-2:#241f2d;
  --surface-3:#2e2837;
  /* warm cream app background + white cards (the "paper" layer) */
  --paper:#f5f5f6;
  --paper-2:#eeeeef;
  --card:#ffffff;
  --hairline: rgba(0,0,0,0.09);
  --hairline-strong: rgba(0,0,0,0.15);
  --hairline-dark: rgba(255,255,255,0.14);
  /* monochrome portal palette — yellow is the ONLY accent color, used sparingly.
     roleta segments are the one deliberately colorful (rainbow) element on the site. */
  --gold:#e6b800;
  --gold-bright:#8a6d00;
  --gold-glow:#ffe98a;
  --gold-dim:#6b5400;
  --blue:#141414;
  --blue-bright:#2b2b2b;
  --blue-soft:#fff6d6;
  --white:#ffffff;
  --ink:#141414;
  --muted:#6b6b70;
  --muted-2:#9a9aa0;
  --danger:#dc2626;
  --success:#16a34a;
  --ink-2:#1c1c1e;
  --ink-3:#262628;
  --surface:#ffffff;
  --surface-2:#f4f4f5;
  --surface-3:#e6e6e8;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background: var(--paper);
  color: var(--ink);
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(0,0,0,0.025), transparent 40%),
    radial-gradient(circle at 90% 95%, rgba(230,184,0,0.05), transparent 45%);
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,.font-display{font-family:'Poppins',sans-serif; letter-spacing:0.01em; font-weight:600;}
.font-mono{font-family:'JetBrains Mono',monospace;}
.eyebrow{
  font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--gold-dim);
}
::selection{background:var(--gold); color:#000;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
button svg{width:16px; height:16px; flex-shrink:0; display:block;}
input{font-family:inherit;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ APP SHELL ============ */
#app{position:relative; z-index:1; min-height:100vh;}
.hidden{display:none !important;}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px; position:relative;
}
.login-crest{
  width:64px; height:64px; border-radius:50%;
  border:1px solid var(--hairline-dark);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:22px;
  background:linear-gradient(160deg, var(--ink-2), var(--void));
  box-shadow: 0 0 0 1px rgba(230,184,0,0.12), 0 20px 40px rgba(20,17,25,0.18);
}
.login-crest svg{width:28px; height:28px; color:var(--gold-glow);}
.login-title{font-size:18px; letter-spacing:0.06em; color:var(--ink); margin:0 0 4px; font-weight:700; font-family:'Poppins',sans-serif;}
.login-sub{font-size:12px; letter-spacing:0.03em; color:var(--muted); text-transform:none; margin:0 0 40px; font-weight:500;}
.login-tabs{
  display:flex; gap:2px; background:var(--surface); border-radius:100px; padding:4px;
  border:1px solid var(--hairline); margin-bottom:28px;
}
.login-tab{
  padding:10px 22px; border-radius:100px; border:none; background:transparent; color:var(--muted);
  font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; transition:all .3s;
}
.login-tab.active{background:linear-gradient(135deg, var(--gold-glow), var(--gold)); color:#1c1408;}
.login-card{
  width:100%; max-width:340px; background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--radius-lg); padding:28px 24px;
}
.field{margin-bottom:16px;}
.field label{display:block; font-size:11px; letter-spacing:0.02em; color:var(--muted); margin-bottom:8px; font-weight:600;}
.field input{
  width:100%; padding:14px 16px; background:var(--void); border:1px solid var(--hairline-dark);
  border-radius:var(--radius-sm); color:var(--white); font-size:15px; outline:none; transition:border .2s;
}
.field input:focus{border-color:var(--gold-glow);}
.field select{
  width:100%; padding:14px 16px; background:var(--paper-2); border:1px solid var(--hairline-strong);
  border-radius:var(--radius-sm); color:var(--ink); font-size:14px; outline:none;
}
.btn-primary{
  width:100%; padding:15px; border-radius:var(--radius-sm); border:none;
  background:linear-gradient(135deg, var(--blue-bright), var(--blue));
  color:#fff; font-size:13px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
  margin-top:6px; transition:transform .15s, box-shadow .15s;
  box-shadow:0 8px 18px -8px rgba(20,20,20,0.35);
}
.btn-primary:active{transform:scale(0.97);}
.login-hint{font-size:11px; color:var(--muted-2); text-align:center; margin-top:18px; line-height:1.6;}
.login-error{color:var(--danger); font-size:12px; text-align:center; margin-top:10px; min-height:16px;}

/* ============ BARBER SHELL ============ */
.bshell{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:calc(96px + var(--safe-bottom)); position:relative;}
.bmain{min-width:0;}
.btopbar{
  display:flex; align-items:center; justify-content:space-between; padding:18px 20px;
  background:linear-gradient(155deg, var(--ink-2), var(--void));
  border-radius:0 0 26px 26px;
  box-shadow:0 14px 30px -18px rgba(20,17,25,0.5);
}
.btopbar .greet{display:flex; align-items:center; gap:12px;}
.avatar{
  width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg, var(--gold-glow), var(--gold-dim));
  display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif; font-weight:600; font-size:16px; color:var(--ink);
}
.greet-name{font-size:12px; color:var(--muted-2); margin:0; letter-spacing:0.02em; opacity:0.75;}
.greet-title{font-size:15px; font-weight:700; margin:1px 0 0; font-family:'Poppins',sans-serif; letter-spacing:0.02em; color:var(--white);}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--hairline); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--muted);
}
.icon-btn svg{width:17px; height:17px;}
.btopbar .icon-btn{background:var(--ink-2); border:1px solid var(--hairline-dark); color:var(--muted-2);}
.btopbar-cta{
  background:linear-gradient(135deg, var(--blue-bright), var(--blue)); color:#fff; border:none;
  padding:10px 16px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:0.04em;
  display:flex; align-items:center; gap:6px; box-shadow:0 6px 14px -6px rgba(20,20,20,0.4);
}
.btopbar-cta svg{width:13px; height:13px;}
.bcontent{padding:16px 20px 8px;}
@keyframes viewFadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.view-enter{animation:viewFadeIn .28s cubic-bezier(.16,1,.3,1);}
@media (prefers-reduced-motion: reduce){ .view-enter{animation:none;} }

/* Membership card - signature element */
.member-card{
  position:relative; border-radius:22px; padding:24px 22px 20px;
  background:
    radial-gradient(circle at 15% -10%, rgba(233,210,143,0.18), transparent 55%),
    linear-gradient(155deg, #1e1e20 0%, #161617 55%, #0e0e0f 100%);
  border:1px solid var(--hairline-dark);
  overflow:hidden;
  box-shadow: 0 24px 50px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.03);
}
.member-card::after{
  content:""; position:absolute; top:-60%; left:-20%; width:70%; height:220%;
  background:linear-gradient(100deg, transparent 40%, rgba(233,210,143,0.06) 48%, rgba(233,210,143,0.12) 50%, rgba(233,210,143,0.06) 52%, transparent 60%);
  transform:rotate(8deg);
}
.mc-top{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
.mc-club{font-size:10px; letter-spacing:0.08em; color:var(--gold-glow); text-transform:uppercase; font-weight:700;}
.mc-tier{
  font-size:9px; letter-spacing:0.05em; text-transform:uppercase; font-weight:700; padding:6px 12px;
  border-radius:100px; background:rgba(255,255,255,0.08); border:1px solid var(--hairline-dark); color:var(--gold-glow);
}
.mc-name{font-family:'Poppins',sans-serif; font-size:22px; font-weight:600; letter-spacing:0.01em; margin:18px 0 2px; position:relative; z-index:1; color:var(--white);}
.mc-role{font-size:11px; color:var(--muted-2); margin:0 0 22px; position:relative; z-index:1;}
.mc-goalrow{display:flex; align-items:center; gap:18px; position:relative; z-index:1;}
.ring-wrap{position:relative; width:88px; height:88px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-pct b{font-family:'Poppins',sans-serif; font-size:20px; line-height:1; color:var(--white);}
.ring-pct span{font-size:9px; color:var(--muted-2); letter-spacing:0.06em; margin-top:2px;}
.mc-goalinfo{flex:1;}
.mc-goalinfo .lbl{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted-2); margin-bottom:6px;}
.mc-goalinfo .val{font-family:'Poppins',sans-serif; font-size:28px; font-weight:600; letter-spacing:0.01em; color:var(--white);}
.mc-goalinfo .val small{font-size:13px; color:var(--muted-2); font-weight:400;}
.mc-remain{font-size:11px; color:var(--gold-glow); margin-top:6px;}

/* Generic sections */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title{font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0;}
.section-link{font-size:11px; color:var(--blue); letter-spacing:0.06em; font-weight:600;}

.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{
  background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:16px;
  transition:box-shadow .2s, transform .2s;
}
.stat-card:hover{box-shadow:0 8px 18px -10px rgba(20,20,20,0.18); transform:translateY(-1px);}
.stat-icon{width:32px; height:32px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--gold-bright); margin-bottom:12px;}
.stat-icon svg{width:16px; height:16px;}
.stat-card .num{font-family:'Poppins',sans-serif; font-weight:600; font-size:24px; color:var(--ink);}
.stat-card .lbl{font-size:10px; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; margin-top:4px;}

.card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:18px; transition:box-shadow .2s;}
.card + .card{margin-top:12px;}

.progress-track{height:8px; border-radius:100px; background:var(--surface-3); overflow:hidden; position:relative;}
.progress-fill{height:100%; border-radius:100px; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); transition:width .8s cubic-bezier(.16,1,.3,1);}

.activity-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--hairline);}
.activity-item:last-child{border-bottom:none;}
.act-icon{width:36px; height:36px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--gold-bright); font-size:15px; flex-shrink:0;}
.act-info{flex:1; min-width:0;}
.act-title{font-size:13px; font-weight:600;}
.act-sub{font-size:11px; color:var(--muted); margin-top:2px;}
.act-points{font-family:'Poppins',sans-serif; color:var(--gold-bright); font-size:14px;}

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  max-width:480px; margin:0 auto;
  background:rgba(19,19,22,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--hairline); border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);
  border-radius:24px 24px 0 0;
  padding:10px 8px calc(10px + var(--safe-bottom));
  display:flex; justify-content:space-around;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none;
  color:rgba(246,244,239,0.5); padding:6px 10px; border-radius:14px; transition:color .2s;
  position:relative;
}
.nav-item svg{width:21px; height:21px;}
.nav-item span{font-size:9px; letter-spacing:0.04em; font-weight:600;}
.nav-item.active{color:var(--gold-glow);}
.nav-item.center{
  background:linear-gradient(135deg, var(--gold-glow), var(--gold)); color:#1c1408;
  width:50px; height:50px; border-radius:50%; margin-top:-24px;
  box-shadow:0 8px 18px -6px rgba(230,184,0,0.45); justify-content:center;
}
.nav-item.center span{display:none;}
.nav-item.center svg{width:22px; height:22px;}

/* ============ META VIEW ============ */
.tier-scale{display:flex; justify-content:space-between; margin-top:14px; position:relative;}
.tier-scale::before{content:""; position:absolute; top:5px; left:0; right:0; height:2px; background:var(--surface-3);}
.tier-mark{display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; flex:1;}
.tier-dot{width:12px; height:12px; border-radius:50%; background:var(--surface-3); border:2px solid var(--muted-2);}
.tier-dot.reached{background:var(--gold-bright); border-color:var(--gold-bright); box-shadow:0 0 0 4px rgba(230,184,0,0.15);}
.tier-mark .tv{font-family:'Poppins',sans-serif; font-size:13px; margin-top:8px;}
.tier-mark .tl{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}

.campaign-card{background:linear-gradient(155deg, var(--surface-2), var(--surface)); border:1px solid var(--hairline-strong); border-radius:var(--radius-md); padding:18px; margin-top:14px;}
.pill-row{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.pill{width:30px; height:30px; border-radius:8px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted-2); border:1px solid var(--hairline);}
.pill.filled{background:linear-gradient(135deg, var(--gold-glow), var(--gold)); color:#1c1408; border-color:transparent;}

/* ============ LAUNCH VIEW ============ */
.service-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
.svc-btn{
  background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:14px;
  text-align:left; color:var(--ink); transition:all .15s; position:relative;
}
.svc-btn:hover{border-color:var(--hairline-strong); transform:translateY(-1px); box-shadow:0 6px 14px -8px rgba(20,20,20,0.15);}
.svc-btn:active{transform:scale(0.97);}
.svc-btn.selected{border-color:var(--gold); background:var(--surface-2); box-shadow:0 0 0 1px var(--gold);}
.svc-name{font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
.svc-pts{font-family:'Poppins',sans-serif; color:var(--gold-bright); font-size:15px;}
.svc-check{position:absolute; top:10px; right:10px; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--hairline-strong); display:flex; align-items:center; justify-content:center;}
.svc-btn.selected .svc-check{background:var(--gold-bright); border-color:var(--gold-bright);}
.svc-btn.selected .svc-check svg{width:11px; height:11px;}

.launch-summary{position:sticky; bottom:110px; margin-top:18px; background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--radius-md); padding:16px; display:flex; align-items:center; justify-content:space-between;}
.launch-total{font-family:'Poppins',sans-serif; font-size:20px; color:var(--gold-bright);}
.btn-confirm{background:linear-gradient(135deg, var(--blue-bright), var(--blue)); border:none; color:#fff; padding:12px 22px; border-radius:100px; font-weight:700; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; box-shadow:0 8px 16px -8px rgba(20,20,20,0.4);}
.btn-confirm:disabled{opacity:0.35;}

.toggle-tabs{display:flex; gap:2px; background:var(--surface); border-radius:100px; padding:4px; border:1px solid var(--hairline); margin-bottom:16px;}
.toggle-tab{flex:1; text-align:center; padding:10px; border-radius:100px; border:none; background:transparent; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; transition:color .15s;}
.toggle-tab:hover:not(.active){color:var(--ink);}
.toggle-tab.active{background:linear-gradient(135deg, var(--gold-glow), var(--gold)); color:#1c1408;}

.stepper{display:flex; align-items:center; justify-content:center; gap:20px; margin:20px 0;}
.step-btn{width:44px; height:44px; border-radius:50%; border:1px solid var(--hairline-strong); background:var(--surface); color:var(--gold-bright); font-size:20px; display:flex; align-items:center; justify-content:center; transition:background .15s;}
.step-btn:hover{background:var(--surface-2);}
.step-val{font-family:'Poppins',sans-serif; font-size:34px; min-width:50px; text-align:center;}

.toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
  background:var(--surface-2); border:1px solid var(--gold); border-radius:100px; padding:12px 22px;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; opacity:0; transition:all .35s cubic-bezier(.16,1,.3,1);
  box-shadow:0 20px 40px -12px rgba(0,0,0,0.6); white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ============ RANKING ============ */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:20px 0 24px;}
.podium-item{text-align:center; width:96px;}
.podium-avatar{width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-size:18px; border:2px solid var(--hairline-strong); background:var(--surface-2); position:relative;}
.podium-item.p1 .podium-avatar{width:70px; height:70px; border-color:var(--gold-bright); box-shadow:0 0 0 4px rgba(230,184,0,0.15);}
.medal{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:16px;}
.podium-bar{background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--hairline); border-top:2px solid var(--gold-dim); border-radius:10px 10px 0 0; padding-top:10px;}
.podium-item.p1 .podium-bar{height:74px; border-top-color:var(--gold-bright);}
.podium-item.p2 .podium-bar{height:52px;}
.podium-item.p3 .podium-bar{height:38px;}
.podium-name{font-size:11px; font-weight:700; margin-top:8px;}
.podium-pct{font-family:'Poppins',sans-serif; color:var(--gold-bright); font-size:15px;}

.rank-row{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--hairline); border-radius:10px; transition:background .15s;}
.rank-row:hover{background:var(--surface-2);}
.rank-num{width:22px; font-family:'Poppins',sans-serif; color:var(--muted); font-size:14px; text-align:center;}
.rank-avatar{width:38px; height:38px; border-radius:50%; background:var(--surface-2); border:1px solid var(--hairline-strong); display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-size:13px; color:var(--gold-bright);}
.rank-info{flex:1;}
.rank-name{font-size:13px; font-weight:600;}
.rank-track{height:5px; border-radius:100px; background:var(--surface-3); margin-top:6px; overflow:hidden;}
.rank-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright));}
.rank-pct{font-family:'Poppins',sans-serif; font-size:15px; color:var(--gold-bright); width:46px; text-align:right;}

/* ============ ROULETTE ============ */
.roulette-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 20px;}
.wheel-outer{position:relative; width:300px; height:300px; margin-top:10px;}
.wheel-pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:5; width:0; height:0;
  border-left:14px solid transparent; border-right:14px solid transparent; border-top:24px solid var(--gold);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));}
.wheel{width:100%; height:100%; border-radius:50%; position:relative; border:7px solid var(--void);

function pctOf(barber){
  return Math.min(100, Math.round((barber.points / barber.goals.meta) * 100));
}
function tierOf(pct){
  if(pct >= 130) return 'Supermeta';
  if(pct >= 100) return 'Platinum';
  if(pct >= 70) return 'Gold';
  if(pct >= 40) return 'Silver';
  return 'Bronze';
}
function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function fmtDate(iso){
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm} · ${hh}:${mi}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = `${ICONS.check.replace('stroke-width="3"','stroke-width="3" width="14" height="14"')} <span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function ringSvg(pct, size=88, stroke=8){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c - (Math.min(pct,100)/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#gold-grad)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)"/>
    <defs><linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--gold)"/><stop offset="100%" stop-color="var(--gold-glow)"/>
    </linearGradient></defs>
  </svg>`;
}

  render();

function bindRoulette(){
  const btn = document.getElementById('spinBtn');
  if(btn) btn.addEventListener('click', spinWheel);
  const close = document.getElementById('closeWinModal');
  if(close) close.addEventListener('click', ()=>{
    document.getElementById('winBackdrop').classList.remove('show');
  });
  const again = document.getElementById('spinAgainBtn');
  if(again) again.addEventListener('click', ()=>{
    document.getElementById('winBackdrop').classList.remove('show');
    setTimeout(spinWheel, 350);
  });
}
function weightedPrizeIndex(){
  const total = DB.prizes.reduce((s,p)=>s+Number(p.probability),0) || 1;
  let r = Math.random()*total;
  for(let i=0;i<DB.prizes.length;i++){
    r -= DB.prizes[i].probability;
    if(r<=0) return i;
  }
  return DB.prizes.length-1;
}
function spinWheel(){
  const b = currentBarber();
  if(b.spinsAvailable < 1 || spinning) return;
  spinning = true;
  b.spinsAvailable -= 1;
  saveDB();
  const idx = weightedPrizeIndex();
  const segAngle = 360/DB.prizes.length;
  const targetMid = idx*segAngle + segAngle/2;
  // pointer at top(0deg); wheel rotates so that targetMid ends at top => rotation = 360*N - targetMid
  const extraSpins = 6;
  const finalRotation = wheelRotation - (wheelRotation % 360) + extraSpins*360 + (360 - targetMid);
  wheelRotation = finalRotation;
  const wheelEl = document.getElementById('wheelEl');
  wheelEl.style.transform = `rotate(${wheelRotation}deg)`;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinBtn').textContent = 'Girando...';
  setTimeout(()=>{
    spinning = false;
    const prize = DB.prizes[idx];
    DB.history.roleta.unshift({date:new Date().toISOString(), barberId:b.id, barberName:b.name, prize:prize.label});
    saveDB();
    renderBarberContent();
    const actions = document.getElementById('winModalActions');
    if(actions && b.spinsAvailable > 0){
      actions.innerHTML = `
        <button class="btn-primary" id="closeWinModal">Continuar</button>
        <button class="btn-ghost-sm" id="spinAgainBtn" style="width:100%; justify-content:center; text-align:center;">Girar de novo (${b.spinsAvailable} disponível)</button>`;
    }
    document.getElementById('winPrizeText').textContent = prize.label;
    document.getElementById('winBackdrop').classList.add('show');
    document.getElementById('closeWinModal').addEventListener('click', ()=>{
      document.getElementById('winBackdrop').classList.remove('show');
    });
    const againBtn = document.getElementById('spinAgainBtn');
    if(againBtn) againBtn.addEventListener('click', ()=>{
      document.getElementById('winBackdrop').classList.remove('show');
      setTimeout(spinWheel, 350);
    });
    launchConfetti();
  }, 5000);
}
function launchConfetti(){
  const colors = ['#e6b800','#141414','#FF3B30','#0A84FF','#34C759'];
  for(let i=0;i<60;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 5+Math.random()*6;
    el.style.width = size+'px';
    el.style.height = (size*0.4+4)+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.opacity = 1;
    const duration = 2200+Math.random()*1400;
    const rot = Math.random()*720-360;
    document.body.appendChild(el);
    el.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(${window.innerHeight+40}px) rotate(${rot}deg)`, opacity:0.9}
    ], {duration, easing:'cubic-bezier(.25,.46,.45,.94)'});
    setTimeout(()=>el.remove(), duration+50);
  }
}

        <thead><tr><th>Data</th><th>Barbeiro</th><th>Serviço</th><th>Pontos</th></tr></thead>
        <tbody>
          ${services.length? services.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${s.barberName}</td><td>${s.serviceName}</td><td style="color:var(--gold-bright); font-weight:700;">+${s.points}</td></tr>`).join('') : `<tr><td colspan="4" class="empty-note">Sem registros.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="panel" style="padding:0;">
      <p class="panel-title" style="padding:18px 18px 0;">Giros na roleta</p>
      <table class="data-table">
        <thead><tr><th>Data</th><th>Barbeiro</th><th>Prêmio</th></tr></thead>
        <tbody>
          ${roleta.length? roleta.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.barberName}</td><td style="color:var(--gold-bright); font-weight:700;">${r.prize}</td></tr>`).join('') : `<tr><td colspan="3" class="empty-note">Sem registros.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

function showModal(){ document.getElementById('modalBackdrop').classList.add('show'); }
function hideModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }

/* ================= INIT ================= */
render();
</script>
</body>
</html>
