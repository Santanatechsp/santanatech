<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villas Performance Club</title>

<style>
/*
 VILLAS PERFORMANCE CLUB
 Protótipo GitHub Pages
 Arquitetura:
 - HTML único
 - CSS interno
 - JavaScript interno
 - Modo demonstração
*/

:root{
    --bg:#0b0b0c;
    --panel:#151518;
    --gold:#d4af37;
    --text:#fff;
    --muted:#999;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

header{
    padding:20px;
    background:#111;
    border-bottom:1px solid #333;
}

.container{
    width:100%;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:var(--panel);
    border-radius:16px;
    padding:20px;
    border:1px solid #292929;
}

button{
    cursor:pointer;
    border:0;
    padding:12px 18px;
    border-radius:10px;
    background:var(--gold);
    font-weight:bold;
}

@media(max-width:700px){
    .container{
        padding:12px;
    }
}
</style>

</head>

<body>

<header>
<h1>VILLAS PERFORMANCE CLUB</h1>
<p>Protótipo de demonstração</p>
</header>


<div class="container">

<div class="grid">

<div class="card">
<h2>Login</h2>
<input id="usuario" placeholder="Usuário">
<br><br>
<input id="senha" type="password" placeholder="Senha">
<br><br>
<button onclick="login()">Entrar</button>
<p id="msg"></p>
</div>


<div class="card">
<h2>Status</h2>
<div id="status">
Aguardando login...
</div>
</div>


<div class="card">
<h2>Ranking</h2>
<div id="ranking"></div>
</div>


<div class="card">
<h2>Roleta</h2>
<button onclick="girar()">Girar</button>
<div id="premio"></div>
</div>


</div>

</div>


<script>

/*
 ================================
 CONFIGURAÇÃO DEMO
 ================================
*/

const CONFIG={
    modoDemo:true,
    empresa:"Villas Performance Club"
};


/*
 ================================
 BANCO SIMULADO
 ================================
*/

let DB={
usuarios:[
{
nome:"Rony Villas",
usuario:"barbeiro",
senha:"barbeiro",
pontos:860,
giros:1
},
{
nome:"Caique Santana",
usuario:"caique",
senha:"123456",
pontos:736,
giros:1
}
],

premios:[
"R$ 10",
"R$ 20",
"R$ 50",
"Produto grátis",
"Vale café",
"+1 giro"
]

};


let sessao=null;


/*
 ================================
 LOGIN
 ================================
*/

function login(){

let u=document.getElementById("usuario").value;
let s=document.getElementById("senha").value;


let usuario=DB.usuarios.find(x=>
x.usuario===u &&
x.senha===s
);


if(!usuario){

document.getElementById("msg").innerHTML=
"Usuário inválido";

return;

}


sessao=usuario;

document.getElementById("status").innerHTML=
`
<h3>${usuario.nome}</h3>
<p>Pontos: ${usuario.pontos}</p>
<p>Giros: ${usuario.giros}</p>
`;

renderRanking();

}


/*
 ================================
 RANKING
 ================================
*/

function renderRanking(){

let lista=[...DB.usuarios]
.sort((a,b)=>b.pontos-a.pontos);


document.getElementById("ranking").innerHTML=
lista.map((x,i)=>
`
<p>
${i+1}º ${x.nome}
- ${x.pontos} pontos
</p>
`
).join("");

}


/*
 ================================
 ROLETA
 ================================
*/

function girar(){

if(!sessao){
alert("Faça login");
return;
}


if(sessao.giros<=0){
alert("Sem giros");
return;
}


sessao.giros--;


let premio=
DB.premios[
Math.floor(
Math.random()*DB.premios.length
)
];


if(premio==="+1 giro"){
sessao.giros++;
}


document.getElementById("premio").innerHTML=
`
<h3>Resultado</h3>
<p>${premio}</p>
<p>Giros restantes: ${sessao.giros}</p>
`;

}


renderRanking();


/*
 =====================================
 ÁREA RESERVADA PARA EVOLUÇÃO PHP
 =====================================

 Futuramente substituir:

 localStorage
       |
       ↓
 API PHP
       |
       ↓
 MySQL


Módulos planejados:

- autenticação
- usuários
- metas
- serviços
- produtos
- ranking
- roleta
- histórico
- relatórios

=====================================
*/


</script>

</body>
